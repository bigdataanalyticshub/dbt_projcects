  - name: stg_sandpodsdbo__dealdashboardv2__hist
    description: >
      Comprehensive deal tracking dashboard data that includes pricing information, approval workflow stages, 
      financial metrics, and deal lifecycle details. This model provides a unified view of deals across the 
      organization for analysis and reporting purposes.
    # tests: # TODO: Re-enable after we clean up dups at the source
    #  - dbt_utils.unique_combination_of_columns:
    #      arguments:
    #        combination_of_columns:
    #          - dealid
    #          - sfproductid
    columns:
      - name: productid
        description: Unique identifier for the product in the deal

      - name: dealid
        description: Unique identifier for the deal
        tests:
          - not_null

      - name: originaldealid
        description: Reference to the original deal ID for deals that have been resubmitted or cloned

      - name: active
        description: Boolean flag indicating if the deal is currently active in the system

      - name: mainopportunity
        description: Main Salesforce opportunity associated with this deal

      - name: accountname
        description: Name of the customer account associated with the deal

      - name: dealdescription
        description: Detailed description of the deal's scope and objectives

      - name: rundate
        description: Date and time when the deal dashboard data was last refreshed or processed

      - name: intakesheetreceived
        description: Date when the intake sheet was received from the sales team

      - name: intakesheetfinalized
        description: Date when the intake sheet was finalized and approved for processing

      - name: spvalidationcomplete
        description: Date when Strategic Pricing completed validation of the deal information

      - name: intakesheetconsumedandpalapplied
        description: Date when the intake sheet was processed and Pricing Approval Logic was applied

      - name: buproductreversestagingpopulated
        description: Date when Business Unit product reverse staging data was populated

      - name: spmanualreviewofpaloutput
        description: Date when Strategic Pricing manually reviewed the Pricing Approval Logic output

      - name: tatcommunicatedtoliaison
        description: Date when the turnaround time was communicated to the liaison

      - name: buoutputgenerated
        description: Date when the Business Unit output was generated

      - name: buoutputemailed
        description: Date when the Business Unit output was emailed to relevant stakeholders

      - name: spreceivesandvalidatesbuoutput
        description: Date when Strategic Pricing received and validated the Business Unit output

      - name: allproductpricingdeterminationscomplete
        description: Date when all product pricing determinations were completed

      - name: communicationtoliaisonwithfinalpricing
        description: Date when final pricing was communicated to the liaison

      - name: sschallengebualternatepricing
        description: Date when Sales Strategy challenged the Business Unit's alternate pricing

      - name: challengemeeting
        description: Date when the challenge meeting occurred to resolve pricing disagreements

      - name: buoutputformupdatedwithchallengeoutcome
        description: Date when Business Unit output form was updated with challenge outcome

      - name: dealcomplete
        description: Date when the deal was marked as complete

      - name: tatactual
        description: Actual turnaround time in days from intake to completion

      - name: tatrequested
        description: Requested turnaround time in days as specified by the sales team

      - name: renewalleadtime
        description: Lead time for renewal in days before contract expiration

      - name: dealstage
        description: Current stage of the deal in the workflow process

      - name: salesexecutive
        description: Sales executive responsible for the deal

      - name: clientservicesexecutive
        description: Client services executive assigned to the account

      - name: submittor
        description: Person who submitted the deal for review and approval

      - name: resubmissionreason
        description: Reason for deal resubmission if applicable

      - name: accounttype
        description: Type classification of the account (e.g., Enterprise, SMB)

      - name: accountmotivation
        description: Identified motivation factors driving the account's purchase decision

      - name: accounthealth
        description: Health status of the account relationship (e.g., Good, At Risk)

      - name: accounthealthexplanation
        description: Detailed explanation of the account health status assessment

      - name: accountsegment
        description: Market segment classification of the account

      - name: accountbudget
        description: Known budget for the account relevant to this deal

      - name: accountbudgetyear
        description: Fiscal year for the account budget

      - name: clientbuyingmotivation
        description: Client's primary motivation for purchasing (e.g., Cost Savings, Compliance)

      - name: pointofcontactandtitleforclient
        description: Main point of contact and their title at the client organization

      - name: decisionmakerandtitleforclient
        description: Decision maker and their title at the client organization

      - name: opportunityname
        description: Name of the Salesforce opportunity associated with the deal

      - name: opptype
        description: Type of opportunity (e.g., New Business, Renewal, Upsell)

      - name: opptypegroup
        description: Grouping category for the opportunity type

      - name: saletype
        description: Type of sale (e.g., Direct, Partner, Reseller)

      - name: customerresponsedeadline
        description: Deadline by which the customer must respond to the proposal

      - name: desiredgolivedate
        description: Customer's desired implementation or go-live date

      - name: targetcontractlength
        description: Target length of the contract in months

      - name: autorenewalclause
        description: Auto-renewal clause included in the contract terms

      - name: autorenewalclausecomments
        description: Additional comments regarding the auto-renewal clause

      - name: termforconveinence
        description: Term for convenience clause in the contract

      - name: termforconveinencecomments
        description: Comments regarding the term for convenience clause

      - name: currentcontractacv
        description: Annual Contract Value of the current contract if this is a renewal

      - name: quotenumber
        description: Quote number for the deal from the CPQ system

      - name: productname
        description: Name of the product included in the deal

      - name: productcode
        description: Product code from the product catalog

      - name: cleanproductcode
        description: Standardized version of the product code for consistent reporting

      - name: paldealapproval
        description: Pricing Approval Logic approval status for the overall deal

      - name: palproductapproval
        description: Pricing Approval Logic approval status for the specific product

      - name: buproductapproval
        description: Business Unit approval status for the product

      - name: businessunit
        description: Business unit responsible for the product in the deal

      - name: lineofbusiness
        description: Line of business for the product

      - name: cleanlineofbusiness
        description: Standardized version of the line of business for consistent reporting

      - name: pricingtype
        description: Type of pricing model used (e.g., Fixed, Tiered, Usage-based)

      - name: tierstairstep
        description: Tier or stair-step pricing structure if applicable

      - name: priceadjustmentbyproduct
        description: Price adjustment percentage specific to the product

      - name: nonstandardpricing
        description: Indicator if non-standard pricing is being used for this deal

      - name: proposedpricelessthancurrentprice
        description: Indicator if proposed price is less than current price for renewals

      - name: sojmixchange
        description: Indicator if there is a change in the State of Jurisdiction mix

      - name: sojs
        description: States of Jurisdiction included in the deal

      - name: package
        description: Package name if the product is part of a package offering

      - name: imepeerspecificvendorpanelorexclusive
        description: IME peer-specific vendor panel or exclusive arrangement details

      - name: imepeerspecificsizeofvendorpanel
        description: Size of the IME peer-specific vendor panel

      - name: imepeerspecificsharepercentage
        description: Share percentage for IME peer-specific arrangements

      - name: unitofmeasure
        description: Unit of measure for the product pricing (e.g., Each, Monthly, Annual)

      - name: volumechange
        description: Indicator of volume change compared to previous contract

      - name: expectedvolume
        description: Expected volume for the product based on customer forecasts

      - name: floorprice
        description: Floor price for the product below which approval is required

      - name: targetprice
        description: Target price for the product that sales should aim for

      - name: acvatproposedfloor
        description: Annual Contract Value calculated at the proposed floor price

      - name: comments
        description: General comments about the deal or product pricing

      - name: brandinvoiceoffawp
        description: Brand invoice off Average Wholesale Price percentage for pharmacy products

      - name: genericinvoiceoffawp
        description: Generic invoice off Average Wholesale Price percentage for pharmacy products

      - name: brandinvoicedispensefee
        description: Brand invoice dispense fee for pharmacy products

      - name: genericinvoicedispensefee
        description: Generic invoice dispense fee for pharmacy products

      - name: rebatesharedwithcustomer
        description: Percentage of rebates shared with the customer

      - name: perscriptfeetocustomer
        description: Per script fee charged to the customer

      - name: networkpenetration
        description: Network penetration percentage for pharmacy network

      - name: brandratio
        description: Expected ratio of brand prescriptions in the mix

      - name: genericratio
        description: Expected ratio of generic prescriptions in the mix

      - name: brandawp
        description: Average Wholesale Price for brand drugs

      - name: genericawp
        description: Average Wholesale Price for generic drugs

      - name: approver
        description: Name of the person who approved the deal pricing

      - name: suggestedfloor
        description: Suggested floor price from Strategic Pricing analysis

      - name: suggestedtarget
        description: Suggested target price from Strategic Pricing analysis

      - name: suggestedbrandinvoiceoffawp
        description: Suggested brand invoice off AWP percentage from Strategic Pricing

      - name: suggestedgenericinvoiceoffawp
        description: Suggested generic invoice off AWP percentage from Strategic Pricing

      - name: suggestedbrandinvoicedispensefee
        description: Suggested brand invoice dispense fee from Strategic Pricing

      - name: suggestedgenericinvoicedispensefee
        description: Suggested generic invoice dispense fee from Strategic Pricing

      - name: suggestedrebatesharedwithcustomer
        description: Suggested percentage of rebates to share with customer

      - name: suggestedperscriptfeetocustomer
        description: Suggested per script fee to charge the customer

      - name: suggestednetworkpenetration
        description: Suggested network penetration percentage from Strategic Pricing

      - name: suggestedbrandratio
        description: Suggested brand ratio from Strategic Pricing analysis

      - name: suggestedgenericratio
        description: Suggested generic ratio from Strategic Pricing analysis

      - name: suggestedbrandawp
        description: Suggested Average Wholesale Price for brand drugs

      - name: suggestedgenericawp
        description: Suggested Average Wholesale Price for generic drugs

      - name: productlinecommentsforsalesteammember
        description: Product line comments specifically for sales team members

      - name: comprehensivepricingcommentsforcmoandspteam
        description: Comprehensive pricing comments for CMO and Strategic Pricing team

      - name: comprehensivepricingcommentsforsalesteammember
        description: Comprehensive pricing comments for sales team members

      - name: rush
        description: Indicator if the deal is being rushed through the approval process

      - name: seltnomination
        description: Senior Executive Leadership Team nomination status for the deal

      - name: preapprovedforall
        description: Indicator if the deal is pre-approved for all products

      - name: resubmission
        description: Indicator if the deal is a resubmission of a previous deal

      - name: spowner
        description: Strategic Pricing owner responsible for this deal

      - name: approvaltypeid
        description: ID of the approval type required for this deal

      - name: trueapprovalrouting
        description: Actual approval routing path used for this deal

      - name: standardtat
        description: Standard turnaround time in days for this type of deal

      - name: circumventprocess
        description: Flag indicating if normal approval process was circumvented

      - name: spcommentary
        description: Commentary from Strategic Pricing team on the deal

      - name: liaisonengaged
        description: Date when the liaison was engaged in the deal process

      - name: volumechangetocurrent
        description: Percentage change in volume compared to current contract

      - name: pricingchangetocurrent
        description: Percentage change in pricing compared to current contract

      - name: revenuechangetocurrent
        description: Percentage change in revenue compared to current contract

      - name: cpichangetocurrent
        description: Consumer Price Index change compared to current contract

      - name: sfproductid
        description: Salesforce product ID for integration reference
        tests:
          - not_null

      - name: oppid
        description: Salesforce opportunity ID for integration reference

      - name: lineitemid
        description: Salesforce line item ID for integration reference

      - name: quotelineid
        description: Salesforce quote line ID for integration reference

      - name: priceoutlierstatus
        description: Status indicating if the price is an outlier compared to similar deals

      - name: volumecategory
        description: Volume category classification for the deal

      - name: q1floorprice
        description: First quartile (25th percentile) of floor prices for similar products

      - name: q3floorprice
        description: Third quartile (75th percentile) of floor prices for similar products

      - name: iqrfloorprice
