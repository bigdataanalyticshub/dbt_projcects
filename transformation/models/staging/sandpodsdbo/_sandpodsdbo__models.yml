      - name: upperboundfloorprice
        description: Upper bound of acceptable floor price range based on statistical analysis

      - name: totaloccurrences
        description: Total number of occurrences of this product in historical deals

      - name: minfloorprice
        description: Minimum floor price observed for this product in historical deals

      - name: maxfloorprice
        description: Maximum floor price observed for this product in historical deals

      - name: avgfloorprice
        description: Average floor price for this product across historical deals

      - name: nopackageflooracv
        description: Floor Annual Contract Value excluding package components

      - name: totalnonpackageacv
        description: Total Annual Contract Value excluding package components

      - name: totalacvchangetocurrent
        description: Total change in Annual Contract Value compared to current contract

      - name: dealopptypegroup
        description: Deal opportunity type grouping for classification purposes

      - name: mettat
        description: Indicator if the deal met the target turnaround time

      - name: tatrequestedclean
        description: Cleaned version of requested turnaround time for analysis

      - name: renewalleadtimeclean
        description: Cleaned version of renewal lead time for analysis

      - name: rev_yr1
        description: Projected revenue for year 1 of the contract

      - name: rev_yr2
        description: Projected revenue for year 2 of the contract

      - name: rev_yr3
        description: Projected revenue for year 3 of the contract

      - name: rev_yr4
        description: Projected revenue for year 4 of the contract

      - name: rev_yr5
        description: Projected revenue for year 5 of the contract

      - name: revchange_yr1
