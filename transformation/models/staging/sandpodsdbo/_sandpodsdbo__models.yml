  - name: stg_sandpodsdbo__pricingprodlist__hist
    description: >
      Standardized representation of the pricing product list containing detailed product information, 
      pricing details, and approval information. This model sources data from the raw pricing product list
      and applies consistent naming conventions.
    columns:
      - name: productcode
        description: Unique product code identifier used across systems to reference this product
        tests:
          - not_null
        #  - unique # TODO: Re-enable after we clean up dups at the source

      - name: productfamily
        description: High-level product family categorization that groups related products together

      - name: productsubfamily
        description: Sub-category within the product family providing more granular product classification

      - name: lineofbusiness
        description: Line of business associated with the product, indicating which business segment owns or sells it

      - name: businessunit
        description: Business unit responsible for the product's development, management, and profitability

      - name: pricebookname
        description: Name of the Salesforce price book containing this product's pricing information

      - name: productname
        description: Full descriptive name of the product as it appears in catalogs and sales materials

      - name: component
        description: Component identifier if the product is a component of a larger product or package

      - name: package
        description: Package identifier if the product is part of a bundled package offering

      - name: salesforcestatus
        description: Current status of the product in Salesforce (Active, Inactive, etc.)

      - name: componentorpackage
        description: Indicator specifying whether the product is a component, package, or standalone offering

      - name: productdescription
        description: Detailed description of the product including its features, benefits, and use cases

      - name: productmanager
        description: Name of the product manager responsible for this product's strategy and roadmap

      - name: productmanageremail
        description: Email address of the product manager for contact purposes

      - name: pricingtype
        description: Type of pricing model used for the product (e.g., Fixed, Tiered, Usage-based)

      - name: unitofmeasure
        description: Unit of measure for the product pricing (e.g., Each, Monthly, Annual, Per User)

      - name: listprice
        description: Standard list price for the product before any discounts or negotiations

      - name: productcostsf
        description: Product cost as recorded in Salesforce for margin calculations

      - name: marginprofile
        description: Margin profile percentage indicating the target profit margin for this product

      - name: productcostsp
        description: Product cost as determined by Strategic Pricing, which may differ from Salesforce cost

      - name: cost_project
        description: Projected cost for the product based on forecasting and planning

      - name: cost_project_notes
        description: Additional notes regarding the projected cost calculations or assumptions

      - name: costtypempuc
        description: Cost type classification (MP/UC) used for internal cost categorization

      - name: rgo_product
        description: Revenue Group Organization product classification for financial reporting

      - name: rgo_sub_product
        description: Revenue Group Organization sub-product classification for more detailed financial reporting

      - name: rgo_sub_sub_product
        description: Revenue Group Organization sub-sub-product classification for the most granular financial reporting

      - name: primaryapprover1
        description: Name of the primary approver responsible for approving pricing exceptions

      - name: primaryapprover1email
        description: Email address of the primary approver for automated approval routing

      - name: primaryapprover2
        description: Name of the secondary approver for pricing exceptions when primary is unavailable

      - name: primaryapprover2email
        description: Email address of the secondary approver for automated approval routing

      - name: created_date
        description: Date when the product record was initially created in the system
