      - name: revchange_yr2
        description: Revenue change for year 2 compared to current contract

      - name: revchange_yr3
        description: Revenue change for year 3 compared to current contract

      - name: revchange_yr4
        description: Revenue change for year 4 compared to current contract

      - name: revchange_yr5
        description: Revenue change for year 5 compared to current contract

      - name: revtotalchange
