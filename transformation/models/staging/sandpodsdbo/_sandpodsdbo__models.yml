version: 2

models:

  - name: stg_sandpodsdbo__cmosalesforcedata__hist
    description: Staging model for CMS Salesforce opportunity and quote line data with standardized column names
    # tests:
    #  - dbt_utils.unique_combination_of_columns:
    #      arguments:
    #        combination_of_columns:
    #          - opportunity_id_case_safe
    #          - line_item_id_case_safe
    #          - quote_line_quote_line_id_case_safe
    columns:
      - name: price_book_price_book_name
        description: Name of the price book associated with the opportunity

      - name: opportunity_id_case_safe
        description: Case-safe unique identifier for the opportunity
        tests:
          - not_null

      - name: line_item_id_case_safe
        description: Case-safe unique identifier for the opportunity line item
        tests:
          - not_null

      - name: quote_line_quote_line_id_case_safe
        description: Case-safe unique identifier for the quote line
        tests:
          - not_null

      - name: quote_line_line_name
        description: Name or description of the quote line item

      - name: quote_line_required_by_line_name
        description: Name of the line item that this quote line is required by (dependency)

      - name: package_parent_product_code
        description: Product code of the parent package if this is part of a bundle

      - name: primary_quote_quote_number
        description: Quote number of the primary quote associated with the opportunity

      - name: price_book_entry_product_product_code
        description: Product code from the price book entry

      - name: price_book_entry_product_product_name
        description: Product name from the price book entry

      - name: opportunity_name
        description: Name of the sales opportunity

      - name: type
        description: Type of opportunity (e.g., New Business, Renewal, Upsell)

      - name: opportunity_owner_full_name
        description: Full name of the sales representative who owns the opportunity

      - name: opportunity_owner_manager
        description: Manager of the opportunity owner

      - name: account_name_account_name
        description: Name of the customer account

      - name: account_name_billing_state_province
        description: Billing state or province for the customer account

      - name: opportunity_line_of_business
        description: Line of business for the opportunity

      - name: description
        description: Detailed description of the opportunity

      - name: revenue_start_date
        description: Date when revenue recognition begins

      - name: stage
        description: Current sales stage of the opportunity

      - name: created_date
        description: Date when the opportunity was created

      - name: price_book_entry_product_product_description
        description: Detailed description of the product from the price book

      - name: price_book_entry_product_unit_of_measure
        description: Unit of measure for the product (e.g., Each, Hour, Month)

      - name: competition
        description: Competitors involved in this opportunity

      - name: quantity
        description: Quantity of the product/service

      - name: cpq_annual_qty
        description: Annual quantity for CPQ (Configure Price Quote) calculations

      - name: quote_line_billing_frequency
        description: Billing frequency for the quote line (e.g., Monthly, Quarterly, Annual)

      - name: sales_price
        description: Unit sales price for the line item

      - name: quote_line_list_price
        description: List price from the quote line

      - name: quote_line_quote_price
        description: Quoted price for the line item

      - name: total_price
        description: Total price for the line item (quantity × sales price)

      - name: amount
        description: Total opportunity amount

      - name: cpq_acv
        description: Annual Contract Value calculated by CPQ

      - name: quote_line_quote_line_acv
        description: Annual Contract Value for the specific quote line

      - name: price_book_entry_product_margin_category
        description: Margin category classification for the product

      - name: current_vendor
        description: Current vendor being used by the customer (for competitive situations)

      - name: quote_line_anchor
        description: Anchor price point for negotiation

      - name: quote_line_target
        description: Target price point for the quote line

      - name: quote_line_floor
        description: Floor (minimum) price for the quote line

      - name: quote_line_floor_cm_pct
        description: Contribution margin percentage at floor price

      - name: quote_line_quote_line_cm_pct
        description: Contribution margin percentage for the quoted price

      - name: account_name_market_segment
        description: Market segment of the customer account

      - name: account_name_customer_segment
        description: Customer segment classification

      - name: account_name_road
        description: Sales road/route assignment for the account

      - name: price_book_entry_product_rgo_product
        description: RGO (Revenue Growth Office) product classification

      - name: price_book_entry_product_rgo_sub_product
        description: RGO sub-product classification

      - name: primary_quote_status
        description: Status of the primary quote

      - name: close_date
        description: Expected or actual close date for the opportunity

      - name: quote_line_approvals_required
        description: Number of approvals required for this quote line

      - name: quote_line_approval_rule_1
        description: First approval rule triggered for this quote line

      - name: quote_line_approval_rule_2
        description: Second approval rule triggered for this quote line

      - name: quote_line_approval_rule_3
        description: Third approval rule triggered for this quote line

      - name: quote_line_approval_rule_4
        description: Fourth approval rule triggered for this quote line

