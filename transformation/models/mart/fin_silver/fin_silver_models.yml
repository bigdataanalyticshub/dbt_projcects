version: 2

models:
  - name: accounting_periods
    description: "This model represents accounting periods used for financial reporting and analysis."
    columns:
      - name: id
        data_type: binary
        description: "Unique identifier for the accounting period"
        tests:
        - unique
        - not_null

      - name: original_accounting_id
        data_type: varchar
        description: "Original identifier for the accounting period from the source system"

      - name: period_type
        data_type: varchar
        description: "Type of accounting period (e.g., month, quarter, year)"

      - name: start_date
        data_type: varchar
        description: "Start date of the accounting period"

      - name: end_date
        data_type: varchar
        description: "End date of the accounting period"

  - name: apricus_adjustment_report
    description: "This table contains detailed information about adjustments made in the Apricus system, including business entity details, service types, revenue information, and accounting data."
    columns:
      - name: be_id
        description: "Unique identifier for the business entity"
        data_type: integer
        tests:
          - not_null

      - name: be_name
        description: "Name of the business entity"
        data_type: varchar

      - name: ae_id
        description: "Unique identifier for the accounting entity"
        data_type: integer

      - name: ae_name
        description: "Name of the accounting entity"
        data_type: varchar

      - name: po_svc_typ
        description: "Type of service at the purchase order level"
        data_type: varchar

      - name: line_svc_typ
        description: "Type of service at the line item level"
        data_type: varchar

      - name: src_syst_cd
        description: "Code identifying the source system of the data"
        data_type: varchar

      - name: lob
        description: "Line of Business"
        data_type: varchar

      - name: revenue_typ
        description: "Type of revenue"
        data_type: varchar

      - name: reason_typ
        description: "Type of reason for the adjustment"
        data_type: varchar

      - name: adj_rsn_cd
        description: "Code for the adjustment reason"
        data_type: varchar

      - name: adj_rsn_desc
        description: "Description of the adjustment reason"
        data_type: varchar

      - name: value_typ
        description: "Type of value (e.g., monetary, percentage)"
        data_type: varchar

      - name: bcb
        description: "Business Component Block identifier"
        data_type: varchar

      - name: mic_bill_id
        description: "Unique identifier for the MIC bill"
        data_type: varchar

      - name: extrnl_inv_id
        description: "External invoice identifier"
        data_type: varchar

      - name: irms_rcvbl_num
        description: "IRMS receivable number"
        data_type: varchar

      - name: acctg_period
        description: "Accounting period for the adjustment"
        data_type: integer

      - name: billed_dt
        description: "Date when the amount was billed"
        data_type: date

      - name: accntng_dt
        description: "Date of accounting for the adjustment"
        data_type: date

      - name: trns_amnt
        description: "Transaction amount of the adjustment"
        data_type: numeric

      - name: po_id
        description: "Purchase Order identifier"
        data_type: varchar

      - name: run_id
        description: "Identifier for the processing run"
        data_type: integer

      - name: prcs_desc
        description: "Description of the process"
        data_type: varchar

      - name: adj_comment
        description: "Comments related to the adjustment"
        data_type: varchar

      - name: irms_user
        description: "IRMS user who made the adjustment"
        data_type: varchar

      - name: gl_acct
        description: "General Ledger account associated with the adjustment"
        data_type: varchar

      - name: ns_class_desc
        description: "NetSuite class description"
        data_type: varchar

      - name: create_dt
        description: "Date when the record was created"
        data_type: timestamp

      - name: acctg_dt_start
        description: "Start date of the accounting period"
        data_type: date

      - name: acctg_dt_end
        description: "End date of the accounting period"
        data_type: date

